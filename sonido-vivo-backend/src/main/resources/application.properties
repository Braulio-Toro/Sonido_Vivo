spring.application.name=sonido-vivo-backend
server.port=8080

# --- Base de datos (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/sonido_vivo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- Flyway: crea las tablas y carga los datos iniciales (V1..V4) al iniciar ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- JWT ---
# Clave en Base64 (32 bytes = 256 bits). En produccion define la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:U29uaWRvVml2b0NsYXZlU2VjcmV0YUpXVDIwMjZEdW9jVUMhISE=}
jwt.expiration-ms=3600000

# --- CORS: origenes del frontend React permitidos (separados por coma) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,http://127.0.0.1:5173}
